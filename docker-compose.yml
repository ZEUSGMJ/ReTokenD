services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Force the local Redis service regardless of what .env carries.
      REDIS_URL: redis://redis:6379
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly persistence so tokens survive restarts / rebuilds.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  # Named volume: token data persists until you explicitly `docker compose down -v`.
  redis_data:
