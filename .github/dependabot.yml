version: 2
updates:
  # Main app at the repo root
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Majors are excluded so they stay in their own reviewable PRs
      app-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Public site is a standalone project with its own lockfile
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      site-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
